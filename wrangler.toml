name = "yjh-family-portal"
main = "./src/main.jsx"
compatibility_date = "2026-10-17"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages static app with D1 + R2 bindings for the family portal.
[[d1_databases]]
binding = "DB"
database_name = "yjh-family-db"
database_id = "82905244-7558-449c-974d-9d630f348383"

[[r2_buckets]]
binding = "MY_BUCKET"
bucket_name = "n8n"

# Existing game archive can remain as a sub-page under this portal.
[[kv_namespaces]]
binding = "GAMES_KV"
id = "bfbf60372a2a443899d6d4d20437fa17"
preview_id = "bfbf60372a2a443899d6d4d20437fa17"

# Example Cloudflare Pages environment variables to add in dashboard:
# - VITE_APP_LANG=zh-CN
# - VITE_APP_R2_ENDPOINT=https://42144f305dad68d45a1eece1f2966bac.r2.cloudflarestorage.com/n8n
